name: Resolve latest stable tag
description: >-
  Resolve the latest stable (non-rc) git tag of the calling repository, matching
  ^v[0-9]+\.[0-9]+\.[0-9]+$. Reads only tag names via an unauthenticated
  git ls-remote, so the repository must be public.

outputs:
  tag:
    description: "The resolved latest stable tag (e.g. v1.4.2)."
    value: ${{ steps.resolve.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Resolve latest stable tag
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        # `|| true`: a no-match (grep exit 1 under pipefail) must not abort here;
        # the empty check below reports it with a clear message.
        tag="$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" \
          | awk '{print $2}' \
          | sed 's#refs/tags/##' \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sort -V \
          | tail -n1 || true)"

        if [ -z "${tag}" ]; then
          echo "No stable (non-rc) tag found for ${GITHUB_REPOSITORY}" >&2
          exit 1
        fi
        echo "Resolved latest stable tag for ${GITHUB_REPOSITORY}: ${tag}"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
