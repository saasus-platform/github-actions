name: Setup Prism mocks
description: >-
  Start one Prism mock server per module from the OpenAPI specs, in static mode
  with --errors (schema validation returns HTTP errors). Each server listens on
  127.0.0.1 on a sequential port. Prism's own logs are kept in files and never
  printed, so response/spec bodies do not leak into the workflow log.

inputs:
  spec-dir:
    description: "Directory containing <module>.yml files (output of fetch-openapi-spec)."
    required: true
  modules:
    description: "Space-separated module list. Each gets its own port, assigned in this order."
    required: false
    default: "auth pricing billing awsmarketplace integration apilog communication"
  base-port:
    description: "First port. Module N listens on base-port + N (0-indexed)."
    required: false
    default: "4010"

runs:
  using: composite
  steps:
    - name: Start Prism mocks
      id: start
      shell: bash
      env:
        SPEC_DIR: ${{ inputs.spec-dir }}
        MODULES: ${{ inputs.modules }}
        BASE_PORT: ${{ inputs.base-port }}
      run: |
        set -euo pipefail
        # Pinned @stoplight/prism-cli version. Kept as a single constant here
        # (not an action input): the version is part of this shared base and is
        # maintained in one place, so callers neither pass nor override it.
        PRISM_VERSION="5.8.1"
        tmp="${RUNNER_TEMP:-/tmp}"
        started="${tmp}/prism-started.tsv"
        : > "${started}"

        # pids currently LISTENing on a TCP port (own user's processes).
        listener_pids() {
          # `|| true` so an empty result (grep exit 1) does not abort under set -e.
          ss -ltnpH "sport = :$1" 2>/dev/null \
            | grep -oE 'pid=[0-9]+' | sed 's/pid=//' | sort -u || true
        }
        # True if pid is the launched process or a direct child of it.
        owned_by_us() {
          local lp="$1" ours="$2"
          [ "${lp}" = "${ours}" ] && return 0
          local pp
          pp="$(ps -o ppid= -p "${lp}" 2>/dev/null | tr -d ' ')"
          [ "${pp}" = "${ours}" ]
        }

        # Install Prism once into a local prefix (avoids re-resolving the
        # package for every module, and avoids relying on the global bin being
        # on PATH inside this step). Retry to absorb transient registry errors.
        echo "Installing @stoplight/prism-cli@${PRISM_VERSION}"
        prism_home="${tmp}/prism-cli"
        mkdir -p "${prism_home}"
        install_ok=""
        for attempt in 1 2 3; do
          if npm install --no-save --no-audit --no-fund \
              --prefix "${prism_home}" "@stoplight/prism-cli@${PRISM_VERSION}" \
              > "${tmp}/npm-install.log" 2>&1; then
            install_ok=1
            break
          fi
          echo "npm install attempt ${attempt} failed; retrying..." >&2
          sleep 5
        done
        prism_bin="${prism_home}/node_modules/.bin/prism"
        if [ -z "${install_ok}" ] || [ ! -x "${prism_bin}" ]; then
          echo "failed to install @stoplight/prism-cli@${PRISM_VERSION} after 3 attempts" >&2
          tail -n 20 "${tmp}/npm-install.log" >&2 || true
          exit 1
        fi

        # Pre-flight: every target port must be free before we launch anything.
        i=0
        for m in ${MODULES}; do
          port=$((BASE_PORT + i))
          if [ -n "$(listener_pids "${port}")" ]; then
            echo "port ${port} (module '${m}') is already in use before launch; aborting" >&2
            exit 1
          fi
          i=$((i + 1))
        done

        i=0
        for m in ${MODULES}; do
          port=$((BASE_PORT + i))
          spec="${SPEC_DIR}/${m}.yml"
          if [ ! -f "${spec}" ]; then
            echo "spec not found for module ${m}: ${spec}" >&2
            exit 1
          fi
          log="${tmp}/prism-${m}.log"
          # Static mode is the default; --errors turns schema violations into HTTP errors.
          nohup "${prism_bin}" mock --errors -h 127.0.0.1 -p "${port}" "${spec}" \
            > "${log}" 2>&1 &
          pid=$!
          url="http://127.0.0.1:${port}"
          printf '%s\t%s\t%s\n' "${m}" "${port}" "${pid}" >> "${started}"
          upper="$(echo "${m}" | tr '[:lower:]' '[:upper:]')"
          echo "PRISM_URL_${upper}=${url}" >> "$GITHUB_ENV"
          i=$((i + 1))
        done

        # Readiness: the launched process must (a) still be alive, (b) be the
        # process actually LISTENing on its port, and (c) answer HTTP. This
        # defeats the case where a different server answers while our Prism is
        # still loading the spec (and will later exit on a bind conflict).
        while IFS=$'\t' read -r m port pid; do
          url="http://127.0.0.1:${port}"
          ok=""
          for _ in $(seq 1 90); do
            if ! kill -0 "${pid}" 2>/dev/null; then
              echo "Prism for module '${m}' exited before becoming ready on port ${port}" >&2
              echo "(likely a spec load failure or a port conflict; diagnostic log retained in the runner temp dir and not uploaded)" >&2
              exit 1
            fi
            lps="$(listener_pids "${port}")"
            if [ -n "${lps}" ]; then
              mine=""
              for lp in ${lps}; do
                if owned_by_us "${lp}" "${pid}"; then mine=1; fi
              done
              if [ -z "${mine}" ]; then
                echo "port ${port} (module '${m}') is served by another process (pids: ${lps}), not the launched Prism (pid ${pid}); aborting" >&2
                exit 1
              fi
              code="$(curl -s -o /dev/null -w '%{http_code}' "${url}" || true)"
              if [ -n "${code}" ] && [ "${code}" != "000" ]; then ok=1; break; fi
            fi
            sleep 1
          done
          if [ -z "${ok}" ]; then
            echo "Prism for module '${m}' did not become ready on port ${port} within the timeout" >&2
            echo "(diagnostic log retained in the runner temp dir and not uploaded)" >&2
            exit 1
          fi
          echo "prism ready: ${m} -> ${url} (pid ${pid})"
        done < "${started}"
